services:
  # Compartment 1: Backend Docker Container (FastAPI + OpenCV + MediaPipe)
  - type: web
    name: sports-injury-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        value: sqlite:///app/database/app.db
      - key: ALLOWED_ORIGINS
        sync: false

  # Compartment 2: Frontend Docker Container (React + Vite + Nginx)
  - type: web
    name: sports-injury-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
